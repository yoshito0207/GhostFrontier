<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07101c"><title>Ghost Frontier</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#eaf4ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;background:#10243a;border:1px solid #3c6386;border-radius:12px;padding:10px 15px}#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 16px;background:#07111fee;border:1px solid #375675;border-radius:99px;display:none}#joy{position:fixed;left:28px;bottom:28px;width:150px;height:150px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;display:none;touch-action:none;z-index:5}#stick{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:#bfe9ff99;border:2px solid #e8f8ff;box-shadow:0 4px 18px #0008;pointer-events:none}@media (pointer:coarse){#joy{display:block}}#joy{position:fixed;left:28px;bottom:28px;width:150px;height:150px;border-radius:50%;background:rgba(120,160,190,.20);border:3px solid rgba(190,220,240,.45);display:none;touch-action:none;box-shadow:inset 0 0 20px rgba(0,0,0,.25)}#stick{position:absolute;left:42px;top:42px;width:66px;height:66px;border-radius:50%;background:rgba(210,235,250,.72);border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 12px rgba(0,0,0,.35)}@media (pointer:coarse){#joy{display:block}}</style></head><body><div id="game"><canvas id="c" width="960" height="540"></canvas></div><div id="joy"><div id="stick"></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let S='TITLE',keys={},mouse={x:0,y:0,click:false},touch={x:0,y:0},audio;
const G={hp:100,max:100,shards:60,progress:0,branch:'未選択',area:'中央街',equip:{move:'なし',guard:'なし',support:'なし'},items:{small:2,large:0},battle:null,ach:new Set(),seen:{},def:{}};
const E={
'将校の亡霊':{hp:180,k:'officer',d:'動きを読んで先回りする亡霊将校。'},'岩喰らい':{hp:105,k:'rock',d:'岩を落として移動範囲を狭める。'},'糸使い':{hp:90,k:'web',d:'糸で道を区切り、進路を制限する。'},'雷獣':{hp:95,k:'thunder',d:'予告円のあとに雷撃を落とす。'},'風喰らい':{hp:100,k:'wind',d:'強い風でプレイヤーを押し流す。'},'鏡の魔物':{hp:90,k:'mirror',d:'過去の移動をコピーして追い込む。'},'氷細工師':{hp:100,k:'ice',d:'床を滑りやすく変化させる。'},'道化師':{hp:85,k:'jester',d:'本物と偽物の予告を混ぜる。'},'時計守':{hp:110,k:'clock',d:'時間の流れを変えて攻撃を再演する。'}};
const A=[['中央街',480,270],['霧の森',250,160],['廃工場',710,170],['地下遺跡',250,380],['要塞都市',710,380],['最終要塞',480,455]];
function fit(){let z=Math.min(innerWidth/960,innerHeight/540);c.style.width=960*z+'px';c.style.height=540*z+'px'}onresize=fit;fit();
function txt(t,a,b,n=20,col='#eaf4ff',al='left',bold=false){x.font=(bold?'700 ':'')+n+'px system-ui';x.fillStyle=col;x.textAlign=al;x.fillText(t,a,b)}function box(a,b,w,h){x.fillStyle='#081321ee';x.beginPath();x.roundRect(a,b,w,h,15);x.fill();x.strokeStyle='#294968';x.lineWidth=2;x.stroke()}function btn(t,a,b,w,h,fn,dis=false){x.fillStyle=dis?'#14202c':'#10243a';x.beginPath();x.roundRect(a,b,w,h,10);x.fill();x.strokeStyle=dis?'#243342':'#3c6386';x.stroke();txt(t,a+w/2,b+h*.67,18,dis?'#65788a':'#fff','center',true);if(!dis&&hit(a,b,w,h))fn()}
function hit(a,b,w,h){if(!mouse.click)return false;let ok=mouse.x>=a&&mouse.x<=a+w&&mouse.y>=b&&mouse.y<=b+h;if(ok)mouse.click=false;return ok}function toast(t){let q=document.getElementById('toast');q.textContent=t;q.style.display='block';clearTimeout(q.t);q.t=setTimeout(()=>q.style.display='none',1400)}
function beep(f=500){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='square';g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.stop(audio.currentTime+.13)}catch(e){}}
function save(){localStorage.gf=JSON.stringify({...G,ach:[...G.ach]});toast('セーブした！');beep(700)}function load(){try{let d=JSON.parse(localStorage.gf);Object.assign(G,d);G.ach=new Set(d.ach||[]);S='BASE';toast('ロードした！')}catch(e){toast('セーブデータがないよ')}}function unlock(a){if(!G.ach.has(a)){G.ach.add(a);toast('実績解除：'+a)}}
function resetGame(){G.hp=100;G.shards=60;G.progress=0;G.branch='未選択';G.area='中央街';G.equip={move:'なし',guard:'なし',support:'なし'};G.items={small:2,large:0};G.battle=null;G.ach=new Set();G.seen={};G.def={};}
function title(){x.fillStyle='#050914';x.fillRect(0,0,960,540);for(let i=0;i<80;i++){x.fillStyle='#7da8c5';x.globalAlpha=.25;x.fillRect(i*137%960,i*83%540,2,2)}x.globalAlpha=1;txt('GHOST FRONTIER',480,135,58,'#edf8ff','center',true);txt('ゴースト・フロンティア',480,173,22,'#8eb7d8','center');box(320,215,320,190);btn((menuIndex===0?'▶ ':'')+'はじめから',350,238,260,48,()=>{resetGame();S='BASE';menuIndex=0});btn((menuIndex===1?'▶ ':'')+'つづきから',350,298,260,48,()=>{load();menuIndex=0});btn((menuIndex===2?'▶ ':'')+'遊び方',350,358,125,38,()=>{S='HELP';menuIndex=0});btn((menuIndex===3?'▶ ':'')+'設定',485,358,125,38,()=>{S='SET';menuIndex=0});txt('iPhone：タップで選択 / バトルは左下のジョイスティック',480,485,16,'#6e8da8','center');txt('PC：矢印キー / Enterでも操作できます',480,510,14,'#55718a','center')}
function base(){x.fillStyle='#102235';x.fillRect(0,0,960,540);txt('中央街',40,55,34,'#fff','left',true);txt('欠片 '+G.shards,920,45,20,'#d7c98a','right');box(32,82,470,405);txt('行き先',55,120,20,'#7ea8c7','left',true);btn('🗺 マップ',55,140,195,54,()=>S='MAP');btn('🛒 ショップ',270,140,195,54,()=>S='SHOP');btn('⚙ 装備',55,210,195,54,()=>S='EQUIP');btn('🎒 アイテム',270,210,195,54,()=>S='ITEM');btn('📖 図鑑',55,280,195,54,()=>S='BOOK');btn('🏆 実績',270,280,195,54,()=>S='ACH');btn('💾 セーブ',55,350,195,54,save);btn('↻ ロード',270,350,195,54,load);box(530,82,398,405);txt('現在の記録',555,120,20,'#7ea8c7','left',true);txt('HP '+G.hp+' / '+G.max,555,160,22);txt('進行度 '+G.progress+'%',555,195,22);txt('分岐 '+G.branch,555,230,19);txt('移動：'+G.equip.move,555,275,17);txt('防護：'+G.equip.guard,555,305,17);txt('補助：'+G.equip.support,555,335,17);txt('敵の仕組みを見抜いて突破しよう。',555,390,18,'#a8bfd0')}
function map(){x.fillStyle='#07111d';x.fillRect(0,0,960,540);txt('ワールドマップ',40,48,32,'#fff','left',true);x.strokeStyle='#294056';x.lineWidth=8;[[480,270,250,160],[480,270,710,170],[480,270,250,380],[480,270,710,380],[250,380,480,455],[710,380,480,455]].forEach(p=>{x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[2],p[3]);x.stroke()});A.forEach((a,i)=>{x.fillStyle=a[0]===G.area?'#d9efff':['#23435c','#1e4b3b','#4a3c2c','#3d3155','#4d2d38','#522a45'][i];x.beginPath();x.arc(a[1],a[2],34,0,7);x.fill();x.strokeStyle='#88aec9';x.stroke();txt(a[0],a[1],a[2]+60,17,'#fff','center',true);if(hit(a[1]-45,a[2]-45,90,90)){G.area=a[0];if(a[0]==='中央街')S='BASE';else startBattle(a[0])}});box(40,85,250,105);txt('探索',60,120,18,'#8eb7d8','left',true);txt('場所をタップして進もう。',60,150,16);txt('戻るで中央街',60,175,14,'#7898b2')}
function startBattle(area){let pool={霧の森:['糸使い','鏡の魔物','道化師'],廃工場:['岩喰らい','雷獣','氷細工師'],地下遺跡:['風喰らい','時計守'],要塞都市:['将校の亡霊'],最終要塞:['将校の亡霊']}[area];let n=pool[Math.floor(Math.random()*pool.length)];let e=E[n];G.battle={name:n,hp:e.hp,max:e.hp,kind:e.k,px:480,py:410,ph:100,time:0,haz:[],hist:[],cool:0};G.seen[n]=(G.seen[n]||0)+1;S='BATTLE';beep(250)}
function enemy(a,b,n){x.save();x.translate(a,b);x.fillStyle=n==='将校の亡霊'?'#c9b7eb':n==='道化師'?'#e3a4d1':'#b7c8d4';x.beginPath();x.arc(0,0,34,0,7);x.fill();x.fillStyle='#172337';x.fillRect(-18,-8,12,7);x.fillRect(6,-8,12,7);x.restore();txt(n,a,b+58,16,'#dce9f3','center',true)}
function battle(){let b=G.battle;x.fillStyle='#050914';x.fillRect(0,0,960,540);box(35,65,890,430);txt(b.name,70,105,30,'#fff','left',true);txt('敵HP '+Math.max(0,b.hp)+' / '+b.max,890,105,17,'#c8d8e6','right');x.fillStyle='#0b1827';x.beginPath();x.roundRect(90,135,780,330,14);x.fill();x.strokeStyle='#31506b';x.stroke();for(let h of b.haz){if(h.type==='c'){x.strokeStyle=h.fake?'#a55d75':'#e0c76d';x.lineWidth=4;x.beginPath();x.arc(h.x,h.y,h.r,0,7);x.stroke()}if(h.type==='r'){x.fillStyle='#66717b';x.beginPath();x.arc(h.x,h.y,h.r,0,7);x.fill()}if(h.type==='w'){x.strokeStyle='#dce7ef';x.lineWidth=5;x.beginPath();x.moveTo(h.x1,h.y1);x.lineTo(h.x2,h.y2);x.stroke()}if(h.type==='m'){x.fillStyle='#a7b8e8';x.fillRect(h.x-10,h.y-10,20,20)}if(h.type==='i'){x.fillStyle='#9fd7e8';x.fillRect(h.x,h.y,h.w,h.h)}}enemy(480,195,b.name);x.fillStyle='#79d2ff';x.beginPath();x.arc(b.px,b.py,12,0,7);x.fill();x.fillStyle='#162638';x.fillRect(90,478,300,20);x.fillStyle='#61c49a';x.fillRect(90,478,300*Math.max(0,b.ph/G.max),20);txt('あなた '+Math.ceil(b.ph)+'/'+G.max,90,473,15);txt('攻勢',150,525,18,'#fff','center',true);txt('対話',315,525,18,'#fff','center',true);txt('戦術',480,525,18,'#fff','center',true);txt('回復',650,525,18,'#fff','center',true);txt('退避',820,525,18,'#fff','center',true);if(hit(90,495,120,45))act('attack');if(hit(255,495,120,45))act('talk');if(hit(420,495,120,45))act('tactic');if(hit(590,495,120,45))act('item');if(hit(760,495,120,45))act('run');updateBattle()}
function updateBattle(){let b=G.battle;b.time++;let sp=G.equip.move==='軽量ブーツ'?4:3;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+touch.x,dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+touch.y;if(dx||dy){let l=Math.hypot(dx,dy);b.px+=dx/l*sp;b.py+=dy/l*sp;b.hist.push([b.px,b.py]);if(b.hist.length>80)b.hist.shift()}b.px=Math.max(105,Math.min(855,b.px));b.py=Math.max(150,Math.min(450,b.py));if(b.time%70===1)pattern(b);for(let h of b.haz){if(h.type==='c'&&Math.hypot(b.px-h.x,b.py-h.y)<h.r&&h.live){hitPlayer(7);h.live=false}if(h.type==='r'&&Math.hypot(b.px-h.x,b.py-h.y)<h.r+10)hitPlayer(3);if(h.type==='w'&&seg(b.px,b.py,h.x1,h.y1,h.x2,h.y2)<8)hitPlayer(2);if(h.type==='m'&&Math.hypot(b.px-h.x,b.py-h.y)<18)hitPlayer(5);if(h.type==='i'&&b.px>h.x&&b.px<h.x+h.w&&b.py>h.y&&b.py<h.y+h.h&&G.equip.support!=='固定装置'){b.px+=dx*.7;b.py+=dy*.7}}b.haz=b.haz.filter(h=>!h.life||--h.life>0);if(b.ph<=0){G.hp=1;S='OVER';beep(90)}}function seg(px,py,x1,y1,x2,y2){let dx=x2-x1,dy=y2-y1,t=((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}function hitPlayer(n){G.battle.ph-=G.equip.guard==='防護装置'?Math.ceil(n*.6):n;beep(100)}
function pattern(b){let k=b.kind;if(k==='officer'){let p=b.hist.at(-1)||[b.px,b.py],q=b.hist[Math.max(0,b.hist.length-18)]||p,dx=p[0]-q[0],dy=p[1]-q[1],l=Math.hypot(dx,dy)||1;b.haz.push({type:'c',x:p[0]+dx/l*80,y:p[1]+dy/l*80,r:34,live:true,life:60});if(b.time%210===1)b.haz.push({type:'c',x:700,y:260,r:50,live:true,life:60,fake:true})}else if(k==='rock'){for(let i=0;i<3;i++)b.haz.push({type:'r',x:150+Math.random()*650,y:170+Math.random()*250,r:18,life:120})}else if(k==='web'){let xx=150+Math.random()*650;b.haz.push({type:'w',x1:xx,y1:150,x2:xx+Math.random()*100-50,y2:450,life:100})}else if(k==='thunder')b.haz.push({type:'c',x:150+Math.random()*650,y:170+Math.random()*240,r:30+Math.random()*35,live:true,life:60});else if(k==='wind'){b.px+=30;if(G.equip.support!=='固定装置')b.px+=20}else if(k==='mirror'&&b.hist.length>15){let p=b.hist[b.hist.length-16];b.haz.push({type:'m',x:p[0],y:p[1],life:55})}else if(k==='ice')b.haz.push({type:'i',x:180+Math.random()*520,y:180+Math.random()*210,w:120,h:65,life:110});else if(k==='jester')for(let i=0;i<2;i++)b.haz.push({type:'c',x:170+Math.random()*620,y:170+Math.random()*230,r:25,live:true,life:55,fake:Math.random()<.5});else b.haz.push({type:'c',x:180+Math.random()*600,y:170+Math.random()*230,r:32,live:true,life:60})}
function act(a){let b=G.battle;if(!b||b.cool>0)return;b.cool=12;if(a==='attack'){b.hp-=18;beep(160)}else if(a==='talk'){b.haz.forEach(h=>h.life=Math.max(10,(h.life||30)-30));if(b.kind==='officer')unlock('読心術');beep(600)}else if(a==='tactic'){b.haz=b.haz.filter((_,i)=>i%2===0);beep(500)}else if(a==='item'){if(G.items.small){G.items.small--;b.ph=Math.min(G.max,b.ph+30);toast('HP +30');beep(700)}else toast('回復カプセルがない')}else if(a==='run'&&b.kind!=='officer'){S='BASE';G.area='中央街';return}if(b.hp<=0)win()}
function win(){let b=G.battle,n=b.name;G.hp=Math.max(1,Math.ceil(b.ph));G.shards+=n==='将校の亡霊'?180:30+Math.floor(Math.random()*31);G.progress=Math.min(100,G.progress+10);G.def[n]=(G.def[n]||0)+1;unlock('初戦突破');if(b.ph>=G.max)unlock('無傷の突破');if(n==='将校の亡霊'){unlock('将校撃破');S='END'}else{S='RESULT';G.result=n+'を突破した！'}beep(900)}
function shop(){simple('ショップ');[['回復カプセル','HP+30',30,'small'],['大型回復薬','HP+60',70,'large'],['防護装置','被ダメ軽減',100,'guard'],['軽量ブーツ','移動速度UP',130,'move'],['反応装置','予告を見やすく',140,'support'],['固定装置','風・氷を弱める',150,'fixed']].forEach((q,i)=>{let y=110+i*58;txt(q[0],100,y+20,18,'#fff','left',true);txt(q[1],300,y+20,15,'#91a9bc');txt(q[2]+' 欠片',690,y+20,16,'#d7c98a','right');btn('購入',720,y,120,38,()=>{if(G.shards<q[2])return;G.shards-=q[2];if(q[3] in G.items)G.items[q[3]]++;else if(q[3]==='move')G.equip.move='軽量ブーツ';else if(q[3]==='guard')G.equip.guard='防護装置';else G.equip.support=q[3]==='support'?'反応装置':'固定装置';toast(q[0]+'を入手！');beep(700)},G.shards<q[2])});btn('中央街へ',70,455,160,40,()=>S='BASE')}
function simple(t){x.fillStyle='#07111d';x.fillRect(0,0,960,540);txt(t,40,50,32,'#fff','left',true);txt('欠片 '+G.shards,920,48,20,'#d7c98a','right');box(70,80,820,385)}
function equip(){simple('装備');[['移動','軽量ブーツ','移動速度UP'],['防護','防護装置','被ダメ軽減'],['補助','反応装置','予告を見やすく'],['補助','固定装置','風・氷を弱める']].forEach((q,i)=>{let y=125+i*75;txt(q[0],110,y,15,'#7ea8c7');txt(q[1],210,y,20);txt(q[2],410,y,15,'#9ab0c0');btn('装備',720,y-25,120,38,()=>{if(q[0]==='移動')G.equip.move=q[1];else if(q[0]==='防護')G.equip.guard=q[1];else G.equip.support=q[1];toast(q[1]+'を装備')})});btn('中央街へ',70,455,160,40,()=>S='BASE')}

function book(){simple('敵図鑑');Object.keys(E).forEach((n,i)=>{let col=i%3,row=Math.floor(i/3),a=95+col*285,b=115+row*105;txt(n,a,b,18,'#fff','left',true);txt('遭遇 '+(G.seen[n]||0)+' / 突破 '+(G.def[n]||0),a,b+25,14,'#7895ad');txt(E[n].d,a,b+48,13,'#9bb0bf')});btn('中央街へ',70,455,160,40,()=>S='BASE')}
function ach(){simple('実績');['初戦突破','無傷の突破','買い物好き','探検家','観察者','読心術','全記録','将校撃破'].forEach((n,i)=>txt((G.ach.has(n)?'◆ ':'◇ ')+n,120+(i%2)*370,140+Math.floor(i/2)*75,20,G.ach.has(n)?'#f2d98b':'#71879b','left',true));btn('中央街へ',70,455,160,40,()=>S='BASE')}
function help(){simple('遊び方');txt('PC：WASD / 矢印キーで移動、Enterで決定、Escで戻る',130,145,20);txt('iPhone：左下のジョイスティックで360°移動',130,195,20);txt('マップから場所を選び、敵ごとの攻撃ルールを見抜いて突破。',130,245,18);txt('欠片はショップで装備やアイテムに交換できる。',130,295,18);txt('セーブはこのブラウザのローカル保存。',130,345,18);btn('タイトルへ',130,410,180,42,()=>S='TITLE')}
function result(){x.fillStyle='#050914';x.fillRect(0,0,960,540);box(260,120,440,300);txt('突破成功！',480,180,34,'#d9f3ff','center',true);txt(G.result,480,225,20,'#fff','center');txt('欠片を獲得した！',480,270,18,'#d7c98a','center');btn('中央街へ',340,335,280,48,()=>{S='BASE';G.area='中央街'})}
function over(){x.fillStyle='#050914';x.fillRect(0,0,960,540);box(270,140,420,260);txt('GAME OVER',480,205,42,'#e2edf5','center',true);txt('旅はまだ終わっていない。',480,250,18,'#8ba4b8','center');btn('中央街へ',350,300,260,45,()=>{G.hp=50;S='BASE'})}
function end(){x.fillStyle='#050914';x.fillRect(0,0,960,540);box(170,70,620,400);txt('最終要塞',480,120,22,'#a7bdd0','center');txt('指揮官の亡霊は静かに消えた。',480,185,25,'#fff','center',true);txt('観察し、選び、突破した。',480,240,20,'#a8c1d2','center');txt('GHOST FRONTIER',480,350,32,'#d6eaf8','center',true);txt('THE END',480,390,24,'#d7c98a','center');btn('中央街へ',340,420,280,38,()=>S='BASE')}
function set(){simple('設定');txt('セーブデータを削除',180,190,20);btn('削除',600,155,120,42,()=>{localStorage.removeItem('gf');toast('削除した')});btn('タイトルへ',340,350,280,42,()=>S='TITLE')}
function setPointer(xp,yp){const r=c.getBoundingClientRect();mouse.x=(xp-r.left)*960/r.width;mouse.y=(yp-r.top)*540/r.height;mouse.click=true}
c.addEventListener('pointerdown',e=>{setPointer(e.clientX,e.clientY);e.preventDefault()});c.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){setPointer(t.clientX,t.clientY)}e.preventDefault()},{passive:false});c.addEventListener('click',e=>{setPointer(e.clientX,e.clientY)});
c.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){setPointer(t.clientX,t.clientY)}e.preventDefault()},{passive:false});
c.addEventListener('click',e=>{setPointer(e.clientX,e.clientY)});
function draw(){joy.style.display=(matchMedia('(pointer:coarse)').matches&&S==='BATTLE')?'block':'none';x.clearRect(0,0,960,540);if(S==='TITLE')title();else if(S==='BASE')base();else if(S==='MAP')map();else if(S==='BATTLE')battle();else if(S==='SHOP')shop();else if(S==='EQUIP')equip();else if(S==='ITEM')item();else if(S==='BOOK')book();else if(S==='ACH')ach();else if(S==='HELP')help();else if(S==='SET')set();else if(S==='RESULT')result();else if(S==='OVER')over();else if(S==='END')end();if(G.battle)G.battle.cool=Math.max(0,G.battle.cool-1)}requestAnimationFrame(draw);
let menuIndex=0;
const menus={TITLE:['start','load','help','set'],BASE:['map','shop','equip','item','book','ach','save','load'],HELP:['back'],SET:['delete','title'],RESULT:['base'],OVER:['base'],END:['base']};
function activate(){
 if(S==='TITLE'){if(menuIndex===0){resetGame();S='BASE'}else if(menuIndex===1)load();else if(menuIndex===2)S='HELP';else S='SET';return}
 if(S==='BASE'){['MAP','SHOP','EQUIP','ITEM','BOOK','ACH'].forEach((v,i)=>{if(menuIndex===i)S=v});if(menuIndex===6)save();if(menuIndex===7)load();return}
 if(S==='HELP'){S='TITLE';return} if(S==='SET'){if(menuIndex===0){localStorage.removeItem('gf');toast('削除した')}else S='TITLE';return}
 if(S==='RESULT'||S==='OVER'||S==='END'){S='BASE';G.area='中央街';return}
 if(S==='MAP'){let idx=Math.max(0,Math.min(A.length-1,menuIndex));let a=A[idx];G.area=a[0];if(a[0]==='中央街')S='BASE';else startBattle(a[0]);return}
 if(S==='SHOP'){let idx=Math.max(0,Math.min(5,menuIndex));let q=[['回復カプセル',30,'small'],['大型回復薬',70,'large'],['防護装置',100,'guard'],['軽量ブーツ',130,'move'],['反応装置',140,'support'],['固定装置',150,'fixed']][idx];if(G.shards<q[1]){toast('欠片が足りない');return}G.shards-=q[1];if(q[2] in G.items)G.items[q[2]]++;else if(q[2]==='move')G.equip.move='軽量ブーツ';else if(q[2]==='guard')G.equip.guard='防護装置';else G.equip.support=q[2]==='support'?'反応装置':'固定装置';toast(q[0]+'を入手！');beep(700);return}
 if(S==='EQUIP'){let q=[['move','軽量ブーツ'],['guard','防護装置'],['support','反応装置'],['support','固定装置']][Math.max(0,Math.min(3,menuIndex))];G.equip[q[0]]=q[1];toast(q[1]+'を装備');return}
 if(S==='ITEM'){if(menuIndex===0&&G.items.small&&G.hp<G.max){G.items.small--;G.hp=Math.min(G.max,G.hp+30);toast('HP +30')}else if(menuIndex===1&&G.items.large){G.items.large--;G.hp=Math.min(G.max,G.hp+60);toast('HP +60')}return}
 if(S==='BOOK'||S==='ACH'){return}
 if(S==='BATTLE'){let acts=['attack','talk','tactic','item','run'];act(acts[menuIndex]);}
}
function currentCount(){return menus[S]?.length|| (S==='MAP'?A.length:S==='SHOP'?6:S==='EQUIP'?4:S==='ITEM'?2:S==='BATTLE'?5:1)}
addEventListener('keydown',e=>{
 keys[e.key]=1;
 const nav=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape',' '];
 if(nav.includes(e.key))e.preventDefault();
 if(e.repeat&&(e.key==='Enter'||e.key===' '||e.key==='Escape'))return;
 if(S==='BATTLE'){
   if(e.key==='Enter'||e.key===' '){activate();return;}
   if(e.key==='Escape'){S='BASE';G.area='中央街';menuIndex=0;return;}
   return;
 }
 const n=currentCount();
 if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')menuIndex=(menuIndex+1)%n;
 if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')menuIndex=(menuIndex-1+n)%n;
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')menuIndex=(menuIndex+1)%n;
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')menuIndex=(menuIndex-1+n)%n;
 if(e.key==='Enter'||e.key===' '){activate();menuIndex=0;}
 if(e.key==='Escape'){if(S!=='TITLE')S='BASE';menuIndex=0;}
});
addEventListener('keyup',e=>keys[e.key]=0);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyActive=false,joyId=null;
function updateJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=42,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}touch.x=dx/max;touch.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{joyActive=true;joyId=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoy(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId){updateJoy(e);e.preventDefault()}});
function endJoy(e){if(e.pointerId!==joyId)return;joyActive=false;joyId=null;touch.x=0;touch.y=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
</script></body></html>
