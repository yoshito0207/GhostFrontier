<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071c29"><title>GHOST FRONTIER</title><style>*{margin:0;padding:0}body{display:flex;justify-content:center;align-items:center;height:100vh;background:#050914}canvas{display:block;image-rendering:pixelated}#toast{position:fixed;bottom:20px;left:20px;background:#081321dd;color:#eaf4ff;padding:10px 15px;border-radius:4px;font-size:14px;z-index:10;font-family:system-ui}#joy{position:fixed;bottom:20px;left:20px;width:100px;height:100px;background:#081321aa;border-radius:50%;display:none;z-index:5;touch-action:none;border:2px solid #294056}#stick{position:absolute;width:50px;height:50px;background:#294056;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}</style></head><body><canvas id="c" width="960" height="540"></canvas><div id="toast"></div><div id="joy"><div id="stick"></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');
let S='TITLE',keys={},mouse={x:0,y:0,click:false},touch={x:0,y:0},audio;
const G={hp:100,max:100,shards:60,progress:0,branch:'未選択',area:'中央街',equip:{move:'なし',guard:'なし',support:'なし'},items:{small:2,large:0},battle:null,ach:new Set(),seen:{},def:{},visitedAreas:new Set(['中央街'])};
const E={'将校の亡霊':{hp:180,k:'officer',d:'動きを読んで先回りする亡霊将校。'},'岩喰らい':{hp:105,k:'rock',d:'岩を落として移動範囲を狭める。'},'糸使い':{hp:90,k:'web',d:'糸を張って移動を制限する。'},'鏡の魔物':{hp:110,k:'mirror',d:'反射攻撃で身を守る鏡の化身。'},'道化師':{hp:95,k:'clown',d:'不規則に動く奇想天外なピエロ。'},'雷獣':{hp:120,k:'thunder',d:'電撃で周囲を薙ぎ払う野獣。'},'氷細工師':{hp:100,k:'ice',d:'氷の迷路を作り出す冷徹な職人。'},'風喰らい':{hp:85,k:'wind',d:'暴風で立ち入りを阻む精霊。'},'時計守':{hp:115,k:'clock',d:'時を操る不可思議な機械仕掛け。'}};
const A=[['中央街',480,270],['霧の森',250,160],['廃工場',710,170],['地下遺跡',250,380],['要塞都市',710,380],['最終要塞',480,455]];
const SHOP_ITEMS=[['回復カプセル',30,'small'],['大型回復薬',70,'large'],['防護装置',100,'guard'],['軽量ブーツ',120,'move'],['反応装置',150,'support'],['固定装置',150,'support']];
let menuIndex=0,shopMenuIndex=0;
function fit(){let z=Math.min(innerWidth/960,innerHeight/540);c.style.width=960*z+'px';c.style.height=540*z+'px'}
onresize=fit;
fit();
function txt(t,a,b,n=20,col='#eaf4ff',al='left',bold=false){x.font=(bold?'700 ':'')+n+'px system-ui';x.fillStyle=col;x.textAlign=al;x.fillText(t,a,b)}
function box(a,b,w,h){x.fillStyle='#081321ee';x.beginPath();x.rect(a,b,w,h);x.fill();x.strokeStyle='#294056';x.lineWidth=2;x.stroke()}
function hit(a,b,w,h){if(!mouse.click)return false;let ok=mouse.x>=a&&mouse.x<=a+w&&mouse.y>=b&&mouse.y<=b+h;if(ok)mouse.click=false;return ok}
function toast(t){let q=document.getElementById('toast');q.textContent=t;setTimeout(()=>{q.textContent=''},3000)}
function beep(f=500){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.1,audio.currentTime);g.gain.exponentialRampToValueAtTime(.01,audio.currentTime+.1);o.start(audio.currentTime);o.stop(audio.currentTime+.1)}catch(e){}}
function save(){localStorage.gf=JSON.stringify({...G,ach:[...G.ach],visitedAreas:[...G.visitedAreas]});toast('セーブした!');beep(700)}
function load(){try{let d=JSON.parse(localStorage.gf);Object.assign(G,d);G.ach=new Set(d.ach);G.visitedAreas=new Set(d.visitedAreas);toast('ロードした!')}catch(e){toast('セーブデータがありません')}}
function resetGame(){G.hp=100;G.shards=60;G.progress=0;G.branch='未選択';G.area='中央街';G.equip={move:'なし',guard:'なし',support:'なし'};G.items={small:2,large:0};G.battle=null;G.ach=new Set();G.seen={};G.def={};G.visitedAreas=new Set(['中央街'])}
function title(){x.fillStyle='#050914';x.fillRect(0,0,960,540);for(let i=0;i<80;i++){x.fillStyle='#7da8c5';x.globalAlpha=.25;x.fillRect(i*137%960,i*83%540,2,2)}x.globalAlpha=1;txt('GHOST FRONTIER',480,100,48,'#d9f3ff','center',true);['ゲーム開始','セーブを読む','遊び方','設定'].forEach((v,i)=>{let sel=menuIndex===i;x.fillStyle=sel?'#1a4d5c':'#0d2a35';x.fillRect(200,200+i*60,560,50);x.strokeStyle='#294056';x.lineWidth=2;x.strokeRect(200,200+i*60,560,50);txt(v,480,225+i*60,20,sel?'#d7c98a':'#eaf4ff','center',sel)})}
function base(){x.fillStyle='#102235';x.fillRect(0,0,960,540);txt('中央街',40,55,34,'#fff','left',true);txt('欠片 '+G.shards,920,45,20,'#d7c98a','right');box(32,82,470,405);txt('行き先',55,120,22,'#d7c98a','left',true);['地図','ショップ','装備','アイテム','敵図鑑','実績','セーブ','ロード'].forEach((v,i)=>{let col=i%2,row=Math.floor(i/2);let sel=menuIndex===i;x.fillStyle=sel?'#1a4d5c':'#0d2a35';x.fillRect(55+col*225,150+row*60,210,50);x.strokeStyle='#294056';x.lineWidth=2;x.strokeRect(55+col*225,150+row*60,210,50);txt(v,160+col*225,175+row*60,18,sel?'#d7c98a':'#eaf4ff','center',sel)})}
function map(){x.fillStyle='#07111d';x.fillRect(0,0,960,540);txt('ワールドマップ',40,48,32,'#fff','left',true);x.strokeStyle='#294056';x.lineWidth=8;[[480,270,250,160],[480,270,710,170],[480,270,250,380],[480,270,710,380],[480,270,480,455]].forEach(v=>{x.beginPath();x.moveTo(v[0],v[1]);x.lineTo(v[2],v[3]);x.stroke()});A.forEach((v,i)=>{let sel=menuIndex===i;x.fillStyle=sel?'#c9b7eb':'#294056';x.beginPath();x.arc(v[1],v[2],40,0,7);x.fill();txt(v[0],v[1],v[2]+6,16,'#fff','center',sel)})}
function startBattle(area){if(area==='最終要塞'){G.battle={name:'将校の亡霊',kind:'officer',max:180,hp:180,px:480,py:240,vx:0,vy:0,time:0,cool:0,hist:[],haz:[],ph:100,isFinal:true,damageTaken:false};G.seen['将校の亡霊']=(G.seen['将校の亡霊']||0)+1}else{let pool={霧の森:['糸使い','鏡の魔物','道化師'],廃工場:['岩喰らい','雷獣','氷細工師'],地下遺跡:['風喰らい','時計守'],要塞都市:['雷獣','氷細工師']},enemies=pool[area]||['糸使い'];let name=enemies[Math.floor(Math.random()*enemies.length)],e=E[name];G.battle={name,kind:e.k,max:e.hp,hp:e.hp,px:480,py:240,vx:0,vy:0,time:0,cool:0,hist:[],haz:[],ph:100,isFinal:false,damageTaken:false};G.seen[name]=(G.seen[name]||0)+1}}
function enemy(a,b,n){x.save();x.translate(a,b);x.fillStyle=n==='将校の亡霊'?'#c9b7eb':n==='道化師'?'#e3a4d1':'#b7c8d4';x.beginPath();x.arc(0,0,34,0,7);x.fill();x.fillStyle='#172337';x.fillRect(-28,-28,56,56);x.restore()}
function battle(){let b=G.battle;x.fillStyle='#050914';x.fillRect(0,0,960,540);box(35,65,890,430);txt(b.name,70,105,30,'#fff','left',true);txt('敵HP '+Math.max(0,b.hp)+' / '+b.max,890,105,17,'#c8d8e6','right');box(650,65,275,50);txt('HP'+G.hp,670,85,20,'#eaf4ff','left');x.fillStyle=G.hp>50?'#5eb34d':G.hp>20?'#e3a434':'#d95861';x.fillRect(720,70,180*G.hp/G.max,15);x.strokeStyle='#294056';x.lineWidth=2;x.strokeRect(720,70,180,15);x.fillStyle='#172337';x.fillRect(50,100,400,350);enemy(250,250,b.name);for(let h of b.haz){x.fillStyle=h.type==='c'?'#d95861':'#8ba4b8';x.globalAlpha=Math.min(1,h.life/20);x.beginPath();x.arc(h.x,h.y,h.r,0,7);x.fill()}x.globalAlpha=1;x.fillStyle='#1a334d';x.fillRect(450,100,435,350);let px=450+G.battle.px,py=100+G.battle.py;x.fillStyle='#2d8cf5';x.beginPath();x.arc(px,py,20,0,7);x.fill();txt('あなた',px,py-30,14,'#d7c98a','center');['攻撃','説得','戦術','アイテム','逃げる'].forEach((v,i)=>{let sel=menuIndex===i;x.fillStyle=sel?'#1a4d5c':'#0d2a35';x.fillRect(465,120+i*52,400,48);x.strokeStyle=sel?'#4db8ff':'#294056';x.lineWidth=2;x.strokeRect(465,120+i*52,400,48);txt(v,480,145+i*52,18,sel?'#d7c98a':'#eaf4ff','center',sel)})}
function updateBattle(){let b=G.battle;b.time++;if(b.cool>0)b.cool--;let sp=G.equip.move==='軽量ブーツ'?4:3;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+touch.x,dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+touch.y;let l=Math.hypot(dx,dy);if(l>0){dx/=l;dy/=l}b.px+=dx*sp;b.py+=dy*sp;b.px=Math.max(0,Math.min(400,b.px));b.py=Math.max(0,Math.min(350,b.py));if(b.time%30===0)pattern(b);b.haz=b.haz.filter(h=>(h.life||30)>0).map(h=>({...h,x:h.x+h.vx,y:h.y+h.vy,life:h.life-1}));let hitCheck=b.haz.some(h=>Math.hypot(b.px-h.x,b.py-h.y)<40);if(hitCheck){let dmg=G.equip.guard==='防護装置'?10:15;G.hp=Math.max(0,G.hp-dmg);b.damageTaken=true;b.haz=[]}if(G.hp<=0){S='OVER';menuIndex=0}if(b.hp<=0)win()}
function pattern(b){let k=b.kind;if(k==='officer'){let p=b.hist.at(-1)||[b.px,b.py],q=b.hist[Math.max(0,b.hist.length-18)]||p,dx=p[0]-q[0],dy=p[1]-q[1],l=Math.hypot(dx,dy)||1;b.haz.push({type:'c',x:p[0],y:p[1],r:30,vx:dx/l*2,vy:dy/l*2,life:30})}else if(k==='rock'){let a=Math.random()*7,l=100;b.haz.push({type:'r',x:Math.cos(a)*l,y:Math.sin(a)*l,r:40,vx:0,vy:0,life:30})}else if(k==='web'){for(let i=0;i<3;i++){let a=7/3*i+Math.random();b.haz.push({type:'w',x:0,y:0,r:20,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,life:40})}}b.hist.push([b.px,b.py])}
function act(a){let b=G.battle;if(!b||b.cool>0)return;b.cool=12;if(a==='attack'){b.hp-=18;beep(160)}else if(a==='talk'){b.haz.forEach(h=>h.life=Math.max(10,(h.life||30)-30));if(b.kind==='officer')unlock('読心術')}else if(a==='tactic'){b.haz=[]}else if(a==='item'&&G.items.large>0){G.items.large--;G.hp=Math.min(G.max,G.hp+60);beep(600)}else if(a==='run'){S='BASE';G.area='中央街';menuIndex=0;shopMenuIndex=0}}
function win(){let b=G.battle,n=b.name;G.shards+=b.isFinal?200:n==='将校の亡霊'?180:30+Math.floor(Math.random()*31);G.progress=Math.min(100,G.progress+10);G.def[n]=(G.def[n]||0)+1;if(!G.def[n]||G.def[n]===1)unlock('初戦突破');if(!b.damageTaken)unlock('無傷の突破');if(b.isFinal){unlock('将校撃破');S='END';menuIndex=0;shopMenuIndex=0}else{G.result=n+' を突破!';S='RESULT';menuIndex=0;shopMenuIndex=0;checkAchievements()}}
function checkAchievements(){let allEnemiesDefeated=Object.keys(E).every(n=>G.def[n]&&G.def[n]>0);if(allEnemiesDefeated)unlock('全記録');let allAreasVisited=A.every(a=>G.visitedAreas.has(a[0]));if(allAreasVisited)unlock('探検家');let seenCount=Object.keys(G.seen).length;if(seenCount>=6)unlock('観察者')}
function purchaseItem(idx){let item=SHOP_ITEMS[idx];if(G.shards>=item[1]){G.shards-=item[1];if(item[2]==='small'||item[2]==='large'){G.items[item[2]]++}else if(item[2]==='move'||item[2]==='guard'){G.equip[item[2]]=item[0]}else if(item[2]==='support'){G.equip.support=item[0]}unlock('買い物好き');toast(item[0]+'を購入しました!');beep(500);return true}else{toast('欠片が足りません');return false}}
function shop(){x.fillStyle='#07111d';x.fillRect(0,0,960,540);txt('ショップ',40,50,32,'#fff','left',true);txt('欠片 '+G.shards,920,48,20,'#d7c98a','right');box(70,80,820,385);let y=120;SHOP_ITEMS.forEach((item,i)=>{let sel=shopMenuIndex===i;let canBuy=G.shards>=item[1];x.fillStyle=sel?'#1a5577':'#0d2a35';x.fillRect(100,y,760,45);x.strokeStyle=sel?'#4db8ff':'#294056';x.lineWidth=2;x.strokeRect(100,y,760,45);txt(item[0],120,y+22,18,sel?'#d7c98a':'#eaf4ff','left',sel);txt('欠片 '+item[1],800,y+22,16,canBuy?'#d7c98a':'#d95861','right');if(hit(100,y,760,45)){purchaseItem(i)}y+=55})}
function simple(t){x.fillStyle='#07111d';x.fillRect(0,0,960,540);txt(t,40,50,32,'#fff','left',true);txt('欠片 '+G.shards,920,48,20,'#d7c98a','right');box(70,80,820,385)}
function equip(){simple('装備');[['移動','軽量ブーツ','移動速度UP'],['防護','防護装置','被ダメ軽減'],['補助','反応装置','予告を見やすく'],['補助','固定装置','移動減速対策']].forEach((v,i)=>{let sel=menuIndex===i;x.fillStyle=sel?'#1a5577':'#0d2a35';x.fillRect(100,140+i*60,760,50);x.strokeStyle=sel?'#4db8ff':'#294056';x.lineWidth=2;x.strokeRect(100,140+i*60,760,50);txt(v[0],120,162+i*60,16,'#8ba4b8','left');txt(v[1],350,162+i*60,18,sel?'#d7c98a':'#eaf4ff','left',sel);txt(v[2],760,162+i*60,14,'#8ba4b8','right')})}
function item(){simple('アイテム');txt('回復カプセル × '+G.items.small,130,160,22);btn('使う',650,125,120,42,()=>{if(G.items.small&&G.hp<G.max){G.items.small--;G.hp=Math.min(G.max,G.hp+30);toast('HP +30')}});txt('大型回復薬 × '+G.items.large,130,240,22);btn('使う',650,205,120,42,()=>{if(G.items.large&&G.hp<G.max){G.items.large--;G.hp=Math.min(G.max,G.hp+60);toast('HP +60')}})}
function btn(t,a,b,w,h){if(hit(a,b,w,h)){x.fillStyle='#1a4d5c';x.fillRect(a,b,w,h)}else x.fillStyle='#0d2a35';x.strokeStyle='#294056';x.lineWidth=2;x.strokeRect(a,b,w,h);txt(t,a+w/2,b+h/2+6,16,'#d7c98a','center')}
function book(){simple('敵図鑑');Object.keys(E).forEach((n,i)=>{let col=i%3,row=Math.floor(i/3),a=95+col*285,b=115+row*105;txt(n,a,b,18,'#fff','left',true);txt('遭遇 '+(G.seen[n]||0)+' / 突破 '+(G.def[n]||0),a,b+25,14,'#8ba4b8','left')})}
function ach(){simple('実績');['初戦突破','無傷の突破','買い物好き','探検家','観察者','読心術','全記録','将校撃破'].forEach((n,i)=>txt((G.ach.has(n)?'◆ ':'◇ ')+n,120,140+i*30,18,G.ach.has(n)?'#d7c98a':'#8ba4b8','left'))}
function help(){simple('遊び方');txt('PC：WASD / 矢印キーで移動、Enterで決定、Escで戻る',130,145,20);txt('iPhone：左下のジョイスティックで360°移動',130,195,20);txt('各エリアで敵と戦い、欠片を集めてアイテムを購入しよう!',130,245,18);txt('敵図鑑をすべて埋めて、全ての実績をアンロック目指そう!',130,295,18)}
function result(){x.fillStyle='#050914';x.fillRect(0,0,960,540);box(260,120,440,300);txt('突破成功!',480,180,34,'#d9f3ff','center',true);txt(G.result,480,225,20,'#fff','center');txt('欠片を獲得した',480,260,18,'#d7c98a','center')}
function over(){x.fillStyle='#050914';x.fillRect(0,0,960,540);box(270,140,420,260);txt('GAME OVER',480,205,42,'#e2edf5','center',true);txt('旅はまだ終わっていない。',480,250,18,'#8ba4b8','center')}
function end(){x.fillStyle='#050914';x.fillRect(0,0,960,540);box(170,70,620,400);txt('最終要塞',480,120,22,'#a7bdd0','center');txt('指揮官の亡霊は静かに消えた。',480,185,25,'#fff','center');txt('すべての戦いが終わり、君は自分の道を進むことにした。',480,250,18,'#8ba4b8','center')}
function set(){simple('設定');txt('セーブデータを削除',180,190,20);btn('削除',600,155,120,42,()=>{localStorage.removeItem('gf');toast('削除した')});btn('タイトルへ',340,350,280,40,()=>{S='TITLE';menuIndex=0;shopMenuIndex=0})}
function unlock(n){if(!G.ach.has(n)){G.ach.add(n);toast('実績 「'+n+'」 をアンロック!')}}
function setPointer(xp,yp){const r=c.getBoundingClientRect();mouse.x=(xp-r.left)*960/r.width;mouse.y=(yp-r.top)*540/r.height;mouse.click=true}
c.addEventListener('pointerdown',e=>{setPointer(e.clientX,e.clientY);e.preventDefault()});
c.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){setPointer(t.clientX,t.clientY)}e.preventDefault()},{passive:false});
function draw(){joy.style.display=(matchMedia('(pointer:coarse)').matches&&S==='BATTLE')?'block':'none';x.clearRect(0,0,960,540);if(S==='TITLE')title();else if(S==='BASE')base();else if(S==='MAP')map();else if(S==='SHOP')shop();else if(S==='EQUIP')equip();else if(S==='ITEM')item();else if(S==='BOOK')book();else if(S==='ACH')ach();else if(S==='HELP')help();else if(S==='SET')set();else if(S==='BATTLE'){updateBattle();battle()}else if(S==='RESULT')result();else if(S==='OVER')over();else if(S==='END')end();requestAnimationFrame(draw)}
draw();
const menus={TITLE:['start','load','help','set'],BASE:['map','shop','equip','item','book','ach','save','load'],HELP:['back'],SET:['delete','title'],RESULT:['base'],OVER:['base'],END:['base'],SHOP:['item0','item1','item2','item3','item4','item5']};
function activate(){
 if(S==='TITLE'){if(menuIndex===0){resetGame();S='BASE'}else if(menuIndex===1)load();else if(menuIndex===2)S='HELP';else S='SET';menuIndex=0;shopMenuIndex=0;return}
 if(S==='BASE'){if(menuIndex===0)S='MAP';else if(menuIndex===1)S='SHOP';else if(menuIndex===2)S='EQUIP';else if(menuIndex===3)S='ITEM';else if(menuIndex===4)S='BOOK';else if(menuIndex===5)S='ACH';else if(menuIndex===6)save();else if(menuIndex===7)load();menuIndex=0;shopMenuIndex=0;return}
 if(S==='HELP'){S='TITLE';menuIndex=0;shopMenuIndex=0;return}
 if(S==='SET'){if(menuIndex===0){localStorage.removeItem('gf');toast('削除した')}else S='TITLE';menuIndex=0;shopMenuIndex=0;return}
 if(S==='RESULT'||S==='OVER'){S='BASE';G.area='中央街';menuIndex=0;shopMenuIndex=0;return}
 if(S==='END'){S='BASE';G.area='中央街';menuIndex=0;shopMenuIndex=0;return}
 if(S==='MAP'){let idx=Math.max(0,Math.min(A.length-1,menuIndex));let a=A[idx];G.area=a[0];G.visitedAreas.add(a[0]);if(a[0]==='中央街')S='BASE';else startBattle(a[0]);menuIndex=0;shopMenuIndex=0;return}
 if(S==='SHOP'){purchaseItem(shopMenuIndex);menuIndex=0;shopMenuIndex=0;return}
 if(S==='EQUIP'){let q=[['move','軽量ブーツ'],['guard','防護装置'],['support','反応装置'],['support','固定装置']][Math.max(0,Math.min(3,menuIndex))];G.equip[q[0]]=q[1];toast(q[1]+'を装備しました!');menuIndex=0;shopMenuIndex=0;return}
 if(S==='ITEM'){if(menuIndex===0&&G.items.small&&G.hp<G.max){G.items.small--;G.hp=Math.min(G.max,G.hp+30);toast('HP +30')}else if(menuIndex===1&&G.items.large){G.items.large--;G.hp=Math.min(G.max,G.hp+60);toast('HP +60')}menuIndex=0;shopMenuIndex=0;return}
 if(S==='BOOK'||S==='ACH'){menuIndex=0;shopMenuIndex=0;return}
 if(S==='BATTLE'){let acts=['attack','talk','tactic','item','run'];act(acts[menuIndex]);menuIndex=0}
}
function currentCount(){return menus[S]?.length||(S==='MAP'?A.length:S==='SHOP'?6:S==='EQUIP'?4:S==='ITEM'?2:S==='BATTLE'?5:1)}
addEventListener('keydown',e=>{
 keys[e.key]=1;
 const nav=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape',' '];
 if(nav.includes(e.key))e.preventDefault();
 if(e.repeat&&(e.key==='Enter'||e.key===' '||e.key==='Escape'))return;
 if(S==='BATTLE'){
   if(e.key==='Enter'||e.key===' '){activate();return}
   if(e.key==='Escape'){S='BASE';G.area='中央街';menuIndex=0;shopMenuIndex=0;return}
   return
 }
 const n=currentCount();
 if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){if(S==='SHOP')shopMenuIndex=(shopMenuIndex+1)%n;else menuIndex=(menuIndex+1)%n}
 if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){if(S==='SHOP')shopMenuIndex=(shopMenuIndex-1+n)%n;else menuIndex=(menuIndex-1+n)%n}
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){if(S==='SHOP')shopMenuIndex=(shopMenuIndex+1)%n;else menuIndex=(menuIndex+1)%n}
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){if(S==='SHOP')shopMenuIndex=(shopMenuIndex-1+n)%n;else menuIndex=(menuIndex-1+n)%n}
 if(e.key==='Enter'||e.key===' '){if(S==='SHOP'){purchaseItem(shopMenuIndex);shopMenuIndex=0}else{activate();menuIndex=0}shopMenuIndex=0}
 if(e.key==='Escape'){if(S!=='TITLE'){S='BASE';menuIndex=0;shopMenuIndex=0}}
});
addEventListener('keyup',e=>keys[e.key]=0);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
let joyActive=false,joyId=null;
function updateJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=42,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}touch.x=dx/max*0.5;touch.y=dy/max*0.5;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{joyActive=true;joyId=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoy(e);e.preventDefault()});
joy.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId){updateJoy(e);e.preventDefault()}});
function endJoy(e){if(e.pointerId!==joyId)return;joyActive=false;joyId=null;touch.x=0;touch.y=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',endJoy);
joy.addEventListener('pointercancel',endJoy);
</script></body></html>
